[project]
name = "cim-lab-8"
version = "0.1.0"
description = "Kalman filtering for noisy and incomplete 2D trajectories"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "hydra-core>=1.3,<1.4",
  "matplotlib>=3.8,<4",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kf = "cim_lab_8.provided.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cim_lab_8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
